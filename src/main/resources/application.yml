server:
  port: 9123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: guo-picture-backend
  profiles:
    active: local
  # session 配置
  session:
    store-type: redis
  # session 30 天过期
    timeout: 2592000



  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB





mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

    enable-sql-runner: true
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.guo.guopicturebackend.controller

# 腾讯混元（密钥见 application-local.yml；此处为默认占位）
# 公共列表 / 详情多级缓存、热点本地缓存（可选覆盖默认值）
picture:
  cache:
    list-redis-ttl-base-seconds: 300
    list-redis-ttl-jitter-seconds: 300
    hot-access-threshold: 40
    hot-window-seconds: 120

tencent:
  hunyuan:
    enabled: false
    secret-id: ""
    secret-key: ""
    region: ap-guangzhou
    model: hunyuan-vision
    auto-fill-after-upload: false
    ai-review-enabled: false

